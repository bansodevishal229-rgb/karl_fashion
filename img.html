<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.banner{
    position: relative;
}

.offer-box{
    position: absolute;
    top: 50%;
    right: 10%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.6);
    width: 450px;
    opacity: 0;
    visibility: hidden;
    transition: 0.5s;
}

.banner:hover .offer-box{
    opacity: 1;
    visibility: visible;
}
</style>

</head>
<body>

<div class="container-fluid p-0">

    <div class="banner">

        <img src="https://picsum.photos/1200/600"
             class="img-fluid w-100"
             alt="Banner">

        <div class="offer-box text-white p-5">

            <span class="badge bg-danger">HOT</span>

            <h1 class="fw-bold mt-3">WHITE T-SHIRT</h1>

            <p>* Free shipping until 25 Dec 2025</p>

            <h3>
                <del class="text-secondary">$25.90</del>
                <span class="text-danger">$15.90</span>
            </h3>

            <button class="btn btn-danger mt-3">
                SHOP NOW
            </button>

        </div>

    </div>

</div>

</body>
</html>
